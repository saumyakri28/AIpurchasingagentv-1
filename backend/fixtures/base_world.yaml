# Canonical catalogue. Every eval trade-off is true here.
# "Today" is frozen at as_of. Sales expand to 120 days; forecasts to 56.
#
# Trade-off map
#   SKU-COVERED     open PO already covers demand; rec of 800 is over-buying
#   SKU-MOQ         true need ~320 vs MOQ 1000
#   SKU-BUDGET      coffee budget remaining << cost of needed qty
#   SKU-STORAGE     bulky cereal, DC-SOUTH cannot hold the recommended qty
#   SKU-SPIKE       last-14d demand step-change vs stale forecast
#   SKU-PROMO       single-day bulk/promo outlier, not a trend
#   SKU-ALT         QuickShip is faster and dearer than Acme
#   SKU-UNRELIABLE  primary is Bargain Cash & Carry (poor fill / reliability)
#   SKU-HEALTHY     recommendation is actually right (accept case)

world: base
as_of: 2026-09-15
random_seed: 42

trade_offs:
  covered_sku: SKU-COVERED
  moq_sku: SKU-MOQ
  budget_sku: SKU-BUDGET
  storage_sku: SKU-STORAGE
  spike_sku: SKU-SPIKE
  promo_sku: SKU-PROMO
  alternate_sku: SKU-ALT
  unreliable_supplier: SUP-UNRELIABLE
  healthy_sku: SKU-HEALTHY

