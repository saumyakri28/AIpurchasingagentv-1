# S2 — Supplier cannot fulfil 500 of SKU-ALT; only 250 confirmed.
# Agent must decide whether the 250-unit gap actually matters.
# QuickShip (the top-up) partial-accepts ~0.6 so the agent's own write
# misses expected_outcome and the recovery loop is forced to run.
include: base_world
world: supplier_shortfall

suppliers:
  - id: SUP-FAST
    name: QuickShip Trading
    active: true
    payment_terms_days: 15
    reliability_score: 0.86
    avg_lead_time_days: 3.0
    lead_time_std_days: 0.8
    fill_rate_pct: 91.0
    on_time_pct: 89.0
    api_behaviour: partial_accept
    api_behaviour_params:
      ratio: 0.6

purchase_orders:
  - id: PO-SHORTFALL
    supplier_id: SUP-RELIABLE
    node_id: DC-NORTH
    status: partially_confirmed
    created_at: 2026-09-08T11:00:00
    expected_delivery_date: 2026-09-22
    total_cost: 2000.0
    created_by: buyer
    lines:
      - id: POL-SHORTFALL-1
        product_id: prod-alt
        ordered_qty: 500
        confirmed_qty: 250
        received_qty: 0
        unit_price: 4.00
